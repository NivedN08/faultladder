[project]
name = "faultladder"
version = "0.1.0"
description = "A held-out robustness benchmark for quadruped walking policies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "NivedN08", email = "122238971+NivedN08@users.noreply.github.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab==1.6.0",
    "mujoco==3.11.0",
    # mjviser 0.0.17 depends on mujoco-core 4.x, which installs into the same
    # mujoco/ directory as mujoco 3.11 and corrupts it. mjlab 1.6.1 adds this
    # same bound; drop it here once mjlab is upgraded.
    "mjviser>=0.0.14,<0.0.17",
    "warp-lang==1.17.0",
    "torch==2.14.0",
    "rsl-rl-lib==5.4.2",
    "numpy",
]

[project.optional-dependencies]
reacher = [
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The lockfile is for development and CI, which are CPU-only. The Modal image
# installs CUDA torch itself.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU; never runs in CI",
    "slow: takes more than a few seconds on a laptop CPU",
]
